<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlantLang — Web REPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ============================================================
   Tokens
   ============================================================ */
:root{
  --bg:        #0b0f0d;
  --bg-raised: #10160f;
  --bg-pane:   #0e1310;
  --line:      #1e2620;
  --line-soft: #171d19;
  --ink:       #e8e6e0;
  --ink-dim:   #9aa39a;
  --ink-faint: #5c655e;
  --leaf:      #4a9d6f;
  --leaf-bright: #6cc794;
  --leaf-dim:  #2e5c42;
  --amber:     #c98a3b;
  --rose:      #b5605a;
  --radius:    10px;
  --font-display: 'Fraunces', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-mono);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ============================================================
   Top bar
   ============================================================ */
.topbar{
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-raised);
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-mark{
  width: 26px; height: 26px;
  display:flex; align-items:center; justify-content:center;
  color: var(--leaf-bright);
  flex-shrink:0;
}
.brand-name{
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 19px;
  letter-spacing: 0.01em;
  color: var(--ink);
}
.brand-name em{
  font-style: italic;
  font-weight: 400;
  color: var(--leaf-bright);
}
.conn-status{
  display:flex; align-items:center; gap:7px;
  font-size: 11.5px;
  color: var(--ink-faint);
  letter-spacing: .02em;
}
.conn-dot{
  width:6px; height:6px; border-radius:50%;
  background: var(--ink-faint);
  transition: background .3s, box-shadow .3s;
}
.conn-dot.online{ background: var(--leaf-bright); box-shadow: 0 0 8px var(--leaf-bright); }
.conn-dot.offline{ background: var(--rose); }

.server-field{
  display:flex; align-items:center; gap:8px;
}
.server-field input{
  background: var(--bg-pane);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 10px;
  width: 190px;
  outline: none;
  transition: border-color .15s, color .15s;
}
.server-field input:focus{ border-color: var(--leaf-dim); color: var(--ink); }

/* ============================================================
   Mode tabs — read like a sentence, not a toolbar
   ============================================================ */
.modes{
  display:flex;
  align-items:baseline;
  gap: 6px;
  padding: 10px 20px 0 20px;
  font-family: var(--font-display);
  font-size: 15px;
  flex-wrap: wrap;
}
.modes .lead{
  color: var(--ink-faint);
  font-style: italic;
  margin-right: 4px;
}
.mode-btn{
  background: none;
  border: none;
  color: var(--ink-dim);
  font-family: var(--font-display);
  font-size: 15px;
  cursor: pointer;
  padding: 4px 3px;
  position: relative;
  transition: color .15s;
}
.mode-btn:hover{ color: var(--ink); }
.mode-btn.active{ color: var(--leaf-bright); }
.mode-btn.active::after{
  content:'';
  position:absolute;
  left:0; right:0; bottom:-2px;
  height:2px;
  background: var(--leaf-bright);
  border-radius: 2px;
}
.mode-sep{ color: var(--line); user-select:none; }

/* ============================================================
   Main split
   ============================================================ */
.main{
  height: calc(100vh - 56px - 44px - 52px);
  display:flex;
}
.pane{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.pane-editor{ border-right: 1px solid var(--line); }

.pane-header{
  height: 34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 0 14px;
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-faint);
  border-bottom: 1px solid var(--line-soft);
  flex-shrink:0;
}
.pane-header .hint{
  font-size: 11px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--ink-faint);
  opacity: .7;
}

.editor-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
}
#editor{
  position:absolute; inset:0;
  width:100%; height:100%;
  background: var(--bg-pane);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.7;
  padding: 16px 18px;
  border:none;
  outline:none;
  resize:none;
  tab-size: 2;
  white-space: pre;
  overflow: auto;
}
#editor::placeholder{ color: var(--ink-faint); }
#editor::selection{ background: var(--leaf-dim); }

.output-wrap{
  flex:1;
  overflow-y:auto;
  padding: 18px;
  background: var(--bg-pane);
  font-size: 13.5px;
  line-height: 1.75;
}
.output-empty{
  color: var(--ink-faint);
  font-style: italic;
  font-family: var(--font-display);
  font-size: 14.5px;
  padding-top: 4px;
}
.out-line{
  opacity:0;
  transform: translateY(3px);
  animation: settle .28s ease forwards;
  white-space: pre-wrap;
  word-break: break-word;
}
@keyframes settle{ to{ opacity:1; transform:none; } }

.out-show{ color: var(--ink); }
.out-ok{ color: var(--ink-dim); }
.out-ok::before{ content:'✓ '; color: var(--leaf-bright); }
.out-error{ color: var(--rose); }
.out-error::before{ content:'✕ '; }
.out-warn{ color: var(--amber); }
.out-info{ color: var(--ink-faint); }
.out-meta{
  color: var(--ink-faint);
  font-size: 12px;
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
}
.out-meta .good{ color: var(--leaf-bright); }
.out-meta .bad{ color: var(--rose); }

.diag-item{
  border-left: 2px solid var(--rose);
  padding: 8px 0 8px 12px;
  margin-bottom: 10px;
}
.diag-item.warning{ border-left-color: var(--amber); }
.diag-item.info{ border-left-color: var(--leaf-dim); }
.diag-code{
  font-size: 10.5px;
  letter-spacing: .04em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.diag-msg{ margin-top: 2px; }
.diag-loc{ color: var(--ink-faint); font-size: 12px; margin-top: 3px; }

.ccode-toggle{
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
}
.ccode-toggle summary{
  cursor:pointer;
  color: var(--ink-faint);
  font-size: 12px;
  letter-spacing: .03em;
  text-transform: uppercase;
  user-select:none;
}
.ccode-toggle summary:hover{ color: var(--ink-dim); }
.ccode-toggle pre{
  margin-top: 10px;
  padding: 12px;
  background: var(--bg-raised);
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  color: var(--ink-dim);
  font-size: 12px;
  line-height: 1.6;
  overflow-x:auto;
}

.spinner-line{
  display:flex; align-items:center; gap:8px;
  color: var(--ink-faint);
  font-style: italic;
  font-family: var(--font-display);
}
.spinner-dot{
  width:5px; height:5px; border-radius:50%;
  background: var(--leaf-bright);
  animation: pulse 1s ease-in-out infinite;
}
.spinner-dot:nth-child(2){ animation-delay:.15s; }
.spinner-dot:nth-child(3){ animation-delay:.3s; }
@keyframes pulse{ 0%,100%{opacity:.25;} 50%{opacity:1;} }

/* ============================================================
   Bottom bar
   ============================================================ */
.bottombar{
  height: 52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 0 20px;
  border-top: 1px solid var(--line);
  background: var(--bg-raised);
  flex-shrink:0;
}
.run-btn{
  display:flex; align-items:center; gap:9px;
  background: var(--leaf);
  color: #08130c;
  border:none;
  border-radius: 8px;
  padding: 10px 20px;
  font-family: var(--font-mono);
  font-weight:600;
  font-size: 13px;
  letter-spacing:.01em;
  cursor:pointer;
  transition: background .15s, transform .1s;
}
.run-btn:hover{ background: var(--leaf-bright); }
.run-btn:active{ transform: scale(.97); }
.run-btn:disabled{
  background: var(--line);
  color: var(--ink-faint);
  cursor: not-allowed;
}
.run-btn kbd{
  font-size:10.5px;
  opacity:.65;
  border:1px solid rgba(8,19,12,.35);
  border-radius:4px;
  padding:1px 5px;
}

.example-select{
  background: var(--bg-pane);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px 10px;
  outline:none;
  cursor:pointer;
}
.example-select:hover{ border-color: var(--leaf-dim); }

.footer-note{
  color: var(--ink-faint);
  font-size: 11.5px;
}
.footer-note a{ color: var(--ink-faint); text-decoration: underline; text-underline-offset: 2px; }
.footer-note a:hover{ color: var(--leaf-bright); }

/* Scrollbars */
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background: var(--line); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background: var(--leaf-dim); }

/* Responsive */
@media (max-width: 860px){
  .main{ flex-direction:column; height:auto; }
  .pane{ min-height: 260px; }
  .pane-editor{ border-right:none; border-bottom:1px solid var(--line); }
  body{ overflow:auto; height:auto; }
  .server-field input{ width:120px; }
  .modes{ font-size:13px; }
}

</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 21C12 21 5 17.5 5 10.5C5 6.5 8 3 12 3C16 3 19 6.5 19 10.5C19 17.5 12 21 12 21Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 21V9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 13C12 13 9 12 9 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="brand-name">Plant<em>Lang</em></span>
  </div>
  <div style="display:flex; align-items:center; gap:18px;">
    <div class="server-field">
      <input id="serverUrl" type="text" value="http://localhost:8420" spellcheck="false">
    </div>
    <div class="conn-status">
      <span class="conn-dot" id="connDot"></span>
      <span id="connLabel">checking…</span>
    </div>
  </div>
</div>

<div class="modes">
  <span class="lead">i want to</span>
  <button class="mode-btn active" data-mode="run">run it</button>
  <span class="mode-sep">/</span>
  <button class="mode-btn" data-mode="check">check its types</button>
  <span class="mode-sep">/</span>
  <button class="mode-btn" data-mode="verify">verify its tests</button>
  <span class="mode-sep">/</span>
  <button class="mode-btn" data-mode="compile">compile it to C</button>
</div>

<div class="main">
  <div class="pane pane-editor">
    <div class="pane-header">
      <span>Source — .plnt</span>
      <span class="hint" id="charCount">0 chars</span>
    </div>
    <div class="editor-wrap">
      <textarea id="editor" spellcheck="false" placeholder="1\ SHOW &quot;Write PlantLang here.&quot;."></textarea>
    </div>
  </div>
  <div class="pane pane-output">
    <div class="pane-header">
      <span id="outputLabel">Output</span>
      <span class="hint" id="elapsedTime"></span>
    </div>
    <div class="output-wrap" id="output">
      <div class="output-empty">Output settles here once you run something.</div>
    </div>
  </div>
</div>

<div class="bottombar">
  <button class="run-btn" id="runBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <span id="runLabel">Run it</span>
    <kbd>⌘⏎</kbd>
  </button>
  <select class="example-select" id="exampleSelect">
    <option value="">Load an example…</option>
  </select>
  <span class="footer-note">Talks to a <a href="../service/README.md" target="_blank">CodeWords Compiler Service</a> over HTTP.</span>
</div>

<script src="examples-data.js"></script>
<script src="app.js"></script>
</body>
</html>
