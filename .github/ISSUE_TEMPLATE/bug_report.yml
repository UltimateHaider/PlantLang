name: Bug Report
description: Report a bug in the PlantLang compiler or runtime
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form
        below so the issue can be reproduced and fixed quickly.
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The compiler version banner, e.g. `Chloroplast 0.49.13 (pure native)`.
        Run `./bin/Chloroplast --version` (or `make all` first) to get it.
      placeholder: "Chloroplast 0.49.13 (pure native)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: >-
        The minimal `.plant` source file (or commands) that trigger the bug.
      placeholder: |
        ACTION main(),
          REAP x FROM REPEAT("ab", 3).
          SHOW x.
          GIVE 0.
        /GIVE main.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Output
      description: What actually happens (compiler error, wrong output, crash, ...).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Output
      description: What you expected to happen instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, GCC version, and how the compiler was built.
      placeholder: |
        - OS: Ubuntu 24.04 x86_64
        - GCC: 13.2.0
        - Built via: make all
    validations:
      required: false