name: test

on:
  push:
    branches: [main, Safarna]
  pull_request:
    branches: [main, Safarna]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build (make all)
        run: make all

      - name: Self-hosting convergence (make self)
        run: make self

      - name: Full test suite (make test)
        run: make test

      - name: Report results
        if: always()
        run: |
          echo "Build and test pipeline finished."
          echo "See the 'make all', 'make self', and 'make test' step logs above."